name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOVERSION: "1.26"

jobs:
  lint:
    name: Lint + Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          CGO_ENABLED=1 go vet -tags wayland ./...

  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install build deps (Wayland + X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev

      - name: Build Wayland binary
        run: |
          CGO_ENABLED=1 go build -tags wayland -o GopherLetics-wayland .

      - name: Build X11 binary (for headless test)
        run: |
          CGO_ENABLED=1 go build -o GopherLetics-x11 .

      - name: Verify binaries exist
        run: |
          ls -lh GopherLetics-wayland GopherLetics-x11
          file GopherLetics-wayland GopherLetics-x11

  build-windows:
    name: Build Windows amd64 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOVERSION }}

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cross-compile for Windows
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
          go build -ldflags="-s -w -H windowsgui" -o GopherLetics.exe .
